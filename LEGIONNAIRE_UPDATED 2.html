<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LEGIONNAIRE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07100d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEGIONNAIRE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07100d;
    color:#f4f7f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,rgba(37,190,104,.16),transparent 35%),
        linear-gradient(180deg,#091510 0%,#07100d 100%);
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:rgba(5,12,9,.94);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(18px);
}

.brand{
    font-weight:950;
    letter-spacing:1.7px;
    font-size:19px;
}

.brand span{
    color:#38e27f;
}

.top-actions{
    display:flex;
    gap:7px;
}

.top-btn{
    border:1px solid rgba(255,255,255,.08);
    background:#101b16;
    color:#dfe8e2;
    padding:8px 10px;
    border-radius:9px;
    font-size:11px;
}

.page{
    max-width:1000px;
    margin:0 auto;
    padding:18px 14px 100px;
}

h1,h2,h3,p{
    margin-top:0;
}

.muted{
    color:#8d9d94;
}

.green{
    color:#42e783;
}

.red{
    color:#ff6464;
}

.yellow{
    color:#ffd45c;
}

.card{
    background:linear-gradient(145deg,#101c16,#0c1612);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:16px;
    margin-bottom:13px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.hero{
    padding:24px 18px;
    border-radius:22px;
    background:
        linear-gradient(135deg,rgba(34,186,97,.18),rgba(8,19,14,.92)),
        #0d1913;
    border:1px solid rgba(62,225,126,.12);
}

.hero h1{
    font-size:31px;
    margin-bottom:8px;
    font-weight:950;
}

.hero p{
    color:#a8b7af;
    line-height:1.65;
}

.grid{
    display:grid;
    gap:12px;
}

.grid-2{
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
    grid-template-columns:repeat(4,minmax(0,1fr));
}

@media(max-width:700px){
    .grid-3,
    .grid-4{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:450px){
    .grid-2{
        grid-template-columns:1fr;
    }
}

.stat{
    background:#0b1510;
    border:1px solid rgba(255,255,255,.06);
    border-radius:13px;
    padding:13px;
}

.stat .label{
    color:#82928a;
    font-size:11px;
    margin-bottom:5px;
}

.stat .value{
    font-size:20px;
    font-weight:900;
}

.big-number{
    font-size:38px;
    font-weight:950;
    line-height:1;
}

.btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px 15px;
    font-weight:850;
    color:#07100d;
    background:#3ce47e;
    transition:.15s;
}

.btn:active{
    transform:scale(.98);
}

.btn.secondary{
    background:#17231d;
    color:#e9f0ec;
    border:1px solid rgba(255,255,255,.08);
}

.btn.danger{
    background:#7e2727;
    color:white;
}

.btn.yellow{
    background:#e4bd48;
    color:#141007;
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.input{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.09);
    background:#09120e;
    color:white;
    outline:none;
}

.input:focus{
    border-color:#36df79;
}

label{
    display:block;
    color:#aab8b0;
    font-size:12px;
    margin-bottom:7px;
}

.field{
    margin-bottom:15px;
}

.range{
    width:100%;
}

.position-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.pos-btn{
    border:1px solid rgba(255,255,255,.08);
    background:#0a140f;
    color:#aebbb4;
    padding:10px 4px;
    border-radius:10px;
    font-size:11px;
}

.pos-btn.active{
    background:#1e5e3b;
    color:white;
    border-color:#3ce47e;
}

.offer{
    position:relative;
    overflow:hidden;
}

.offer::before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:4px;
    background:#35df78;
}

.club-head{
    display:flex;
    align-items:center;
    gap:12px;
}

.club-logo{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#18271f;
    font-size:22px;
    font-weight:900;
}

.club-name{
    font-size:18px;
    font-weight:900;
}

.badge{
    display:inline-block;
    padding:4px 7px;
    border-radius:6px;
    background:#17251e;
    color:#93a49b;
    font-size:10px;
    margin-top:4px;
}

.role{
    margin-top:12px;
    padding:10px;
    background:#09130f;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.05);
}

.role strong{
    display:block;
    margin-bottom:4px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:67px;
    z-index:60;
    display:flex;
    justify-content:center;
    background:rgba(5,12,9,.96);
    border-top:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(18px);
    overflow-x:auto;
}

.nav-inner{
    display:flex;
    min-width:680px;
    width:min(100%,1000px);
}

.nav-item{
    flex:1;
    min-width:68px;
    border:0;
    background:transparent;
    color:#6f7f76;
    font-size:10px;
    padding:8px 3px;
}

.nav-item.active{
    color:#41e783;
}

.nav-icon{
    display:block;
    font-size:18px;
    margin-bottom:3px;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:10px;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:min(900px,100%);
    max-height:94vh;
    overflow:auto;
    background:#0b1510;
    border:1px solid rgba(255,255,255,.08);
    border-radius:23px 23px 12px 12px;
    box-shadow:0 30px 100px rgba(0,0,0,.55);
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{transform:translateY(35px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

.modal-head{
    padding:18px 18px 5px;
}

.modal-body{
    padding:12px 18px 20px;
}

.modal-title{
    font-size:22px;
    font-weight:950;
}

.modal-close{
    float:left;
    border:0;
    background:#17231d;
    color:#bdc9c2;
    width:32px;
    height:32px;
    border-radius:50%;
}

.feedback{
    padding:15px;
    border-radius:14px;
    background:#111f17;
    border:1px solid rgba(255,255,255,.06);
    line-height:1.65;
}

.feedback.good{
    border-color:rgba(58,224,123,.3);
}

.feedback.bad{
    border-color:rgba(255,91,91,.28);
}

.feedback.neutral{
    border-color:rgba(255,205,75,.25);
}

.scene{
    width:100%;
    margin:12px 0 15px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:#163b27;
    box-shadow:inset 0 0 50px rgba(0,0,0,.25);
}

.scene svg{
    display:block;
    width:100%;
    height:auto;
}

.choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

@media(max-width:550px){
    .choice-grid{
        grid-template-columns:1fr;
    }
}

.choice{
    min-height:57px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    background:#101c16;
    color:#eef5f0;
    text-align:right;
    padding:12px;
    font-weight:750;
}

.choice:hover{
    border-color:#37df79;
}

.meter{
    height:8px;
    border-radius:99px;
    background:#18251f;
    overflow:hidden;
    margin-top:7px;
}

.meter > div{
    height:100%;
    background:#3de17c;
    border-radius:99px;
}

.table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

.table th,
.table td{
    padding:9px 5px;
    border-bottom:1px solid rgba(255,255,255,.05);
    text-align:center;
}

.table th:first-child,
.table td:first-child{
    text-align:right;
}

.table .user-row{
    background:rgba(59,225,123,.08);
}

.fixture{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.fixture:last-child{
    border-bottom:0;
}

.fixture-result{
    font-size:19px;
    font-weight:950;
}

.tag{
    border-radius:7px;
    padding:4px 7px;
    font-size:9px;
    background:#17241e;
    color:#95a69d;
}

.event-card{
    border:1px solid rgba(60,228,126,.17);
    background:
        radial-gradient(circle at 85% 20%,rgba(58,225,124,.1),transparent 30%),
        #0d1913;
}

.event-label{
    font-size:10px;
    letter-spacing:1px;
    color:#42e783;
    font-weight:900;
    text-transform:uppercase;
}

.wheel-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:20px 0;
    position:relative;
}

.wheel{
    width:230px;
    height:230px;
    border-radius:50%;
    background:
        conic-gradient(
            #a73838 0deg 252deg,
            #247b4b 252deg 360deg
        );
    border:7px solid #18251f;
    box-shadow:0 0 0 2px rgba(255,255,255,.06),0 15px 50px rgba(0,0,0,.4);
    position:relative;
    transition:transform 2.4s cubic-bezier(.12,.76,.14,1);
}

.wheel::before{
    content:"";
    position:absolute;
    inset:38%;
    border-radius:50%;
    background:#0a130f;
    border:4px solid #27372e;
    z-index:2;
}

.wheel-text{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
    font-size:13px;
    font-weight:950;
    pointer-events:none;
}

.wheel-caught{
    position:absolute;
    top:36%;
    left:9%;
    transform:rotate(-40deg);
    font-weight:900;
    color:white;
}

.wheel-safe{
    position:absolute;
    bottom:27%;
    right:11%;
    transform:rotate(-40deg);
    font-weight:900;
    color:white;
}

.pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-top:22px solid #f4f7f5;
    z-index:5;
}

.penalty-stage{
    perspective:800px;
    height:300px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    background:
        linear-gradient(180deg,#79a7c5 0 35%,#2c6f45 35% 100%);
}

.penalty-ground{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-55px;
    height:220px;
    background:#27703f;
    transform:rotateX(55deg);
    transform-origin:bottom;
    border-top:2px solid rgba(255,255,255,.7);
}

.goal{
    position:absolute;
    width:230px;
    height:115px;
    left:50%;
    top:30px;
    transform:translateX(-50%);
    border:7px solid white;
    border-bottom:0;
    box-shadow:0 0 0 2px rgba(0,0,0,.18);
    background:
        repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.22) 23px 24px),
        repeating-linear-gradient(0deg,transparent 0 20px,rgba(255,255,255,.2) 21px 22px);
}

.keeper{
    position:absolute;
    left:50%;
    top:103px;
    width:58px;
    height:84px;
    transform:translateX(-50%);
    transition:transform .8s cubic-bezier(.2,.8,.2,1);
    z-index:5;
}

.keeper-head{
    position:absolute;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#d6a37d;
    top:0;
    left:17px;
}

.keeper-body{
    position:absolute;
    width:34px;
    height:42px;
    border-radius:10px 10px 5px 5px;
    background:#202b36;
    top:21px;
    left:12px;
}

.keeper-arm{
    position:absolute;
    width:38px;
    height:9px;
    background:#202b36;
    top:28px;
    border-radius:10px;
}

.keeper-arm.left{
    right:28px;
    transform:rotate(25deg);
}

.keeper-arm.right{
    left:28px;
    transform:rotate(-25deg);
}

.keeper-leg{
    position:absolute;
    width:9px;
    height:34px;
    background:#202b36;
    top:59px;
    border-radius:8px;
}

.keeper-leg.left{
    left:13px;
    transform:rotate(12deg);
}

.keeper-leg.right{
    right:13px;
    transform:rotate(-12deg);
}

.penalty-ball{
    position:absolute;
    left:50%;
    bottom:42px;
    width:18px;
    height:18px;
    margin-left:-9px;
    border-radius:50%;
    background:white;
    border:2px solid #222;
    z-index:10;
    transition:left .78s cubic-bezier(.12,.8,.2,1),bottom .78s cubic-bezier(.12,.8,.2,1),transform .78s cubic-bezier(.12,.8,.2,1);
    box-shadow:0 2px 4px rgba(0,0,0,.3);
}

.penalty-player{
    position:absolute;
    left:50%;
    bottom:-15px;
    transform:translateX(-50%);
    width:52px;
    height:100px;
    z-index:7;
}

.player-head{
    width:25px;
    height:25px;
    border-radius:50%;
    background:#d6a37d;
    margin:auto;
}

.player-body{
    width:34px;
    height:47px;
    margin:2px auto 0;
    background:#37c96e;
    border-radius:9px;
}

.player-legs{
    width:36px;
    height:33px;
    margin:auto;
    position:relative;
}

.player-legs:before,
.player-legs:after{
    content:"";
    position:absolute;
    width:9px;
    height:34px;
    background:#20262a;
    border-radius:8px;
}

.player-legs:before{
    left:6px;
}

.player-legs:after{
    right:6px;
}

.penalty-stage.shot .penalty-ball{
    transition:all .75s cubic-bezier(.2,.8,.2,1);
}

.penalty-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:10px;
}

.penalty-zone{
    border:1px solid rgba(255,255,255,.07);
    background:#101b16;
    border-radius:12px;
    padding:11px 6px;
    color:white;
    font-size:11px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 10px;
}

.section-title h2{
    margin:0;
    font-size:18px;
}

.small{
    font-size:11px;
}

.center{
    text-align:center;
}

.list-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.list-row:last-child{
    border-bottom:0;
}

.toast{
    position:fixed;
    bottom:82px;
    left:50%;
    transform:translateX(-50%);
    background:#18251f;
    border:1px solid rgba(255,255,255,.1);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    z-index:200;
    display:none;
    font-size:12px;
}

.toast.show{
    display:block;
    animation:toast .18s ease;
}

@keyframes toast{
    from{opacity:0;transform:translate(-50%,10px)}
    to{opacity:1;transform:translate(-50%,0)}
}

.warning{
    background:#241c0c;
    border:1px solid rgba(255,198,67,.15);
    color:#e9d08b;
    border-radius:12px;
    padding:11px;
    line-height:1.55;
}

.info{
    background:#0e1b25;
    border:1px solid rgba(86,170,225,.14);
    color:#a9cee4;
    border-radius:12px;
    padding:11px;
    line-height:1.55;
}

.kpi{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.kpi strong{
    font-size:16px;
}

hr{
    border:0;
    border-top:1px solid rgba(255,255,255,.06);
    margin:15px 0;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
    <div class="brand">LEGION<span>NAIRE</span></div>

    <div class="top-actions">
        <button class="top-btn" onclick="saveGame()">שמור</button>
        <button class="top-btn" onclick="loadGame()">טען</button>
        <button class="top-btn" onclick="newGame()">חדש</button>
    </div>
</header>

<main id="page" class="page"></main>

<nav id="bottomNav" class="bottom-nav hidden">
    <div class="nav-inner">
        <button class="nav-item" data-screen="dashboard" onclick="navTo('dashboard')">
            <span class="nav-icon">⌂</span>בית
        </button>
        <button class="nav-item" data-screen="matches" onclick="navTo('matches')">
            <span class="nav-icon">⚽</span>משחקים
        </button>
        <button class="nav-item" data-screen="season" onclick="navTo('season')">
            <span class="nav-icon">▤</span>טבלה
        </button>
        <button class="nav-item" data-screen="training" onclick="navTo('training')">
            <span class="nav-icon">♨</span>אימונים
        </button>
        <button class="nav-item" data-screen="agent" onclick="navTo('agent')">
            <span class="nav-icon">◆</span>סוכן
        </button>
        <button class="nav-item" data-screen="locker" onclick="navTo('locker')">
            <span class="nav-icon">▣</span>לוקר
        </button>
        <button class="nav-item" data-screen="career" onclick="navTo('career')">
            <span class="nav-icon">★</span>קריירה
        </button>
        <button class="nav-item" data-screen="profile" onclick="navTo('profile')">
            <span class="nav-icon">●</span>פרופיל
        </button>
    </div>
</nav>

</div>

<div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
        <div class="modal-head">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalTitle" class="modal-title"></div>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   LEGIONNAIRE
   COMPLETE SINGLE FILE
   MONTHLY CAREER ENGINE
   ========================================================= */

const POS = {
    GK:"שוער",
    CB:"בלם",
    LB:"מגן שמאלי",
    RB:"מגן ימני",
    CDM:"קשר אחורי",
    CM:"קשר",
    CAM:"קשר התקפי",
    LW:"כנף שמאל",
    RW:"כנף ימין",
    ST:"חלוץ"
};

/* ---------------------------------------------------------
   CLUB DATABASE
   tier:
   1 = Premier
   2 = National
   3 = Liga Alef
   4 = Liga Bet
   --------------------------------------------------------- */

const CLUBS = [

    {name:"מכבי תל אביב",level:90,tier:1,league:"ליגת העל"},
    {name:"מכבי חיפה",level:89,tier:1,league:"ליגת העל"},
    {name:"הפועל באר שבע",level:84,tier:1,league:"ליגת העל"},

function $(id){
    return document.getElementById(id);
}

function clamp(n,min,max){
    return Math.max(min,Math.min(max,n));
}

function rnd(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function esc(str){
    return String(str ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

    t.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{

function ensureState(){

        S.penaltyStats={
            taken:0,

        };
    }

    if(!Array.isArray(S.eventHistory)){

    if(!Array.isArray(S.news)){
        S.news=[];
    }

    if(!Array.isArray(S.trophies)){
        S.trophies=[];
    }

    if(typeof S.month!=="number"){
        S.month=Math.max(1,Math.ceil((S.week||1)/4));
    }

    if(typeof S.teamMorale!=="number"){
        S.teamMorale=70;
    }

    if(typeof S.roleLevel!=="number"){
        S.roleLevel=3;
    }

    if(typeof S.careerMonths!=="number"){
        S.careerMonths=0;
    }

    if(typeof S.year!=="number"){
        S.year=2027+(Math.max(0,Number(S.season||1)-1));
    }

    if(!Array.isArray(S.currentOffers)){
        S.currentOffers=[];
    }

    if(S.club && typeof S.club==="string"){
        const found=CLUBS.find(c=>c.name===S.club);
        if(found) S.club=found;
    }

    if(S.club){
        updateStatusFromRole();
    }
}

/* ---------------------------------------------------------
   ROLE SYSTEM
   --------------------------------------------------------- */

const ROLE_NAMES = {
    1:"הרכב",
    2:"רוטציה גבוהה",
    3:"רוטציה נמוכה",
    4:"ספסל"
};

function roleName(){

    return ROLE_NAMES[S.roleLevel] || "רוטציה נמוכה";
}

function updateStatusFromRole(){

    S.status=roleName();
}

function initialRole(club,ovr){

    /*
      Deliberately hard.

      The league itself matters heavily.
      A 16 year old with 65 OVR does NOT walk
      into a top-flight starting XI.
    */

    let r;

    if(club.tier===1){

        r = Math.random()<0.18 ? 3 : 4;

        if(ovr >= club.level-12 && Math.random()<0.25){
            r=3;
        }
    }

    else if(club.tier===2){

        r = Math.random()<0.38 ? 3 : 4;

        if(ovr >= club.level-7 && Math.random()<0.32){
            r=3;
        }
    }

    else if(club.tier===3){

        r = Math.random()<0.68 ? 3 : 4;

        if(ovr >= club.level-8 && Math.random()<0.55){
            r=2;
        }
    }

    else{

        r = Math.random()<0.68 ? 2 : 1;

        if(ovr < club.level-5 && Math.random()<0.5){
            r=3;
        }
    }

    return r;
}

/* ---------------------------------------------------------
   OFFERS
   --------------------------------------------------------- */

function offerRoleExplanation(club,role){

    if(role===1){
        return "הרכב. המאמן רואה בך שחקן שיכול להתחיל משחקים כבר מההתחלה.";
    }

    if(role===2){
        return "רוטציה גבוהה. אתה קרוב להרכב ותקבל דקות משמעותיות, אבל תצטרך להוכיח את עצמך.";
    }

    if(role===3){
        return "רוטציה נמוכה. אתה חלק מהסגל, אבל הדקות יהיו מוגבלות בתחילת הדרך.";
    }

    return "ספסל. מדובר בקבוצה חזקה ביחס לשלב שלך בקריירה, ולכן תצטרך להרוויח את הדקות.";
}

function makeOffers(){

    const playerLevel=S.ovr;

    /*
      Don't simply give the player three easy clubs.
      Offer pool intentionally spans levels.
    */

    let pool=[...CLUBS];

    pool.sort((a,b)=>{

        const da=Math.abs(a.level-playerLevel);
        const db=Math.abs(b.level-playerLevel);

        return da-db;
    });

    const near=pool.slice(0,6);
    const medium=pool.slice(6,16);
    const broad=pool.slice(16);

    let selected=[];

    function addRandomFrom(arr){

        if(!arr.length)return;

        const c=pick(arr);

        if(!selected.some(x=>x.name===c.name)){
            selected.push(c);
        }
    }

    addRandomFrom(near);
    addRandomFrom(medium);
    addRandomFrom(broad);

    while(selected.length<4){

        addRandomFrom(pool);

        if(selected.length>=pool.length)break;
    }

    selected=selected.slice(0,4);

    return selected.map(club=>{

        const role=initialRole(club,S.ovr);

        return {
            club,
            role,
            salary:salaryFor(club,role,S.ovr)
        };
    });
}

function salaryFor(club,role,ovr){

    let base;

    if(club.tier===1) base=4800;
    else if(club.tier===2) base=2800;
    else if(club.tier===3) base=1600;
    else base=900;

    base += Math.max(0,ovr-club.level)*65;

    if(role===1)base*=1.12;
    if(role===4)base*=.82;

    return Math.round(base/50)*50;
}

function chooseOffer(index){

    const offer=S.currentOffers[index];

    if(!offer)return;

    S.club=offer.club;
    S.roleLevel=offer.role;
    S.status=ROLE_NAMES[S.roleLevel];

    S.salary=offer.salary;

    S.money=0;

    S.screen="dashboard";

    S.news.unshift(
        `חתמת ב${S.club.name}. המעמד שלך: ${S.status}.`
    );

    buildCareer();

    saveGame();

    render();
}

/* ---------------------------------------------------------
   CAREER BUILD
   --------------------------------------------------------- */

function leagueTeams(){

    if(!S.club)return [];

    return CLUBS.filter(c=>c.tier===S.club.tier);
}

function buildCareer(){

    S.fixtures=[];
    S.table={};

    const teams=leagueTeams();

    for(const t of teams){
        S.table[t.name]={
            club:t,
            pts:0,
            p:0,
            w:0,
            d:0,
            l:0,
            gf:0,
            ga:0
        };
    }

    const opponents=teams.filter(t=>t.name!==S.club.name);

    let month=1;

    /*
      Each month contains 3 or 4 internal league games.
      User does NOT manually advance them.
    */

    for(let i=0;i<38;i++){

        const opp=opponents[i%opponents.length];

        S.fixtures.push({
            month,
            opponent:opp.name,
            opponentClub:opp,
            home:(i%2===0),
            played:false,
            gf:null,
            ga:null,
            important:
                opp.level>=S.club.level-3 ||
                Math.abs(opp.level-S.club.level)<=3 ||
                isDerby(S.club,opp)
        });

        if((i+1)%4===0)month++;
    }

    if(S.fixtures.length){
        syncTable();
    }
}

function isDerby(a,b){

    if(!a||!b)return false;

    const names=[a.name,b.name];

    const telAviv=names.every(n=>n.includes("תל אביב"));

    const jerusalem=names.every(n=>n.includes("ירושלים"));

    return telAviv || jerusalem;
}

function syncTable(){

    if(!S.club)return;

    const teams=leagueTeams();

    if(!S.table || Object.keys(S.table).length!==teams.length){

        S.table={};

        teams.forEach(t=>{
            S.table[t.name]={
                club:t,
                pts:0,
                p:0,
                w:0,
                d:0,
                l:0,
                gf:0,
                ga:0
            };
        });
    }

    const user=S.table[S.club.name];

    if(!user)return;

    /*
      Table remains season state.
      Other teams get simulated baseline records to avoid
      unrealistically easy title runs.
    */

    teams.forEach(t=>{

        if(t.name===S.club.name)return;

        const row=S.table[t.name];

        if(row.p===0){

            const games=Math.max(0,S.careerMonths*3-1);

            row.p=games;

            const strength=t.level;

            const baseWin=Math.max(
                0.15,
                Math.min(
                    0.72,
                    0.44+(strength-S.club.level)/100
                )
            );

            row.w=Math.floor(games*baseWin*.65);
            row.d=Math.floor(games*.20);
            row.l=Math.max(
                0,
                games-row.w-row.d
            );

            row.gf=row.w*1.25+row.d*.8;
            row.ga=row.l*1.25+row.d*.8;

            row.gf=Math.round(row.gf);
            row.ga=Math.round(row.ga);

            row.pts=row.w*3+row.d;
        }
    });
}

/* ---------------------------------------------------------
   MONTH ENGINE
   --------------------------------------------------------- */

function matchesThisMonth(){

    return S.fixtures.filter(
        f=>f.month===S.month && !f.played
    );
}

function importantMatchThisMonth(){

    const list=matchesThisMonth();

    return list.find(f=>f.important) || list[0] || null;
}

function monthlyAppearanceChance(){

    let chance;

    switch(S.roleLevel){

        case 1:
            chance=.90;
            break;

        case 2:
            chance=.68;
            break;

        case 3:
            chance=.43;
            break;

        default:
            chance=.18;
    }

    /*
      Trust and form matter.
    */

    chance += (S.trust-50)/300;
    chance += (S.form-50)/500;

    return clamp(chance,.08,.96);
}

function simulateNormalMatch(fixture){

    const chance=monthlyAppearanceChance();

    const played=Math.random()<chance;

    const opp=fixture.opponentClub;

    let homeGoals;
    let awayGoals;

    const strengthDiff=S.club.level-opp.level;

    let expectedUser=.95+strengthDiff*.025;

    expectedUser+=S.form*.004;
    expectedUser+=S.teamMorale*.002;

    if(!fixture.home){
        expectedUser-=.12;
    }

    expectedUser=clamp(expectedUser,.25,2.8);

    let expectedOpp=1.05-strengthDiff*.018;

    if(fixture.home){
        expectedOpp-=.08;
    }else{
        expectedOpp+=.08;
    }

    expectedOpp=clamp(expectedOpp,.25,2.8);

    if(fixture.home){

        homeGoals=poissonish(expectedUser);
        awayGoals=poissonish(expectedOpp);

    }else{

        awayGoals=poissonish(expectedUser);
        homeGoals=poissonish(expectedOpp);
    }

    fixture.played=true;
    fixture.gf=fixture.home?homeGoals:awayGoals;
    fixture.ga=fixture.home?awayGoals:homeGoals;

    applyTeamResult(fixture);

    if(played){

        const minutes=Math.round(
            18+
            Math.random()*65*
            (
                S.roleLevel===1?1:
                S.roleLevel===2?.82:
                S.roleLevel===3?.55:.32
            )
        );

        S.apps++;
        S.seasonApps++;
        S.minutes+=minutes;
        S.seasonMinutes+=minutes;

        const scoringChance=
            .035+
            S.ovr*.0009+
            S.form*.0005+
            (S.pos==="ST"||S.pos==="LW"||S.pos==="RW"?0.018:0);

        if(Math.random()<scoringChance){

            S.goals++;
            S.seasonGoals++;
        }

        if(Math.random()<.07){

            S.assists++;
            S.seasonAssists++;
        }

        S.form=clamp(
            S.form+
            (fixture.gf>fixture.ga?rnd(1,3):
             fixture.gf<fixture.ga?rnd(-3,-1):rnd(-1,1)),
            1,99
        );

        S.morale=clamp(
            S.morale+
            (fixture.gf>fixture.ga?2:
             fixture.gf<fixture.ga?-2:0),
            1,100
        );
    }

    S.fitness=clamp(S.fitness-rnd(3,7),0,100);
}

function poissonish(expected){

    /*
      Small football-score generator.
      Keeps scores realistic.
    */

    const r=Math.random();

    if(expected<.55){

        if(r<.60)return 0;
        if(r<.92)return 1;
        return 2;
    }

    if(expected<1.1){

        if(r<.34)return 0;
        if(r<.76)return 1;
        if(r<.94)return 2;
        return 3;
    }

    if(expected<1.7){

        if(r<.19)return 0;
        if(r<.53)return 1;
        if(r<.81)return 2;
        if(r<.94)return 3;
        return 4;
    }

    if(r<.12)return 0;
    if(r<.37)return 1;
    if(r<.68)return 2;
    if(r<.86)return 3;
    if(r<.95)return 4;
    return 5;
}

function applyTeamResult(fixture){

    const user=S.table[S.club.name];
    const opp=S.table[fixture.opponent];

    if(!user||!opp)return;

    user.p++;
    opp.p++;

    user.gf+=fixture.gf;
    user.ga+=fixture.ga;

    opp.gf+=fixture.ga;
    opp.ga+=fixture.gf;

    if(fixture.gf>fixture.ga){

        user.w++;
        user.pts+=3;

        opp.l++;
    }

    else if(fixture.gf<fixture.ga){

        opp.w++;
        opp.pts+=3;

        user.l++;
    }

    else{

        user.d++;
        opp.d++;

        user.pts++;
        opp.pts++;
    }
}

/* ---------------------------------------------------------
   MONTH EVENT SELECTION
   --------------------------------------------------------- */

function chooseMonthlyEvent(){

    const important=importantMatchThisMonth();

    const r=Math.random();

    /*
      Much more match action.
      Coach is intentionally rare.
    */

    if(important && r<.58){

        return {
            type:"match",
            fixture:important
        };
    }

    if(r<.86){

        return {
            type:"dilemma"
        };
    }

    return {
        type:"coach"
    };
}

/* ---------------------------------------------------------
   ADVANCE MONTH
   --------------------------------------------------------- */

function advanceMonth(){

    if(!S.club)return;

    if(S.pendingEvent && !S.eventResolved){
        // If an old save left a finished event behind, reopen it instead of blocking the season.
        if(S.eventResolved===true){
            S.pendingEvent=null;
        }else{
            openMonthlyEvent();
            toast("פתח קודם את אירוע החודש");
            return;
        }
    }

    if(S.month>12){
        S.pendingEvent=null;
        S.eventResolved=true;
        endSeason();
        return;
    }

    S.monthlySummary=[];

    const monthFixtures=matchesThisMonth();

    const event=chooseMonthlyEvent();

    const specialFixture=event.type==="match"
        ?event.fixture
        :null;

    /*
      Simulate all ordinary matches.
      If the event is a match moment, leave that important
      match unfinished until the decision.
    */

    monthFixtures.forEach(f=>{

        if(specialFixture && f===specialFixture){
            return;
        }

        simulateNormalMatch(f);

        S.monthlySummary.push(f);
    });

    /*
      Recovery / salary / general progression.
    */

    S.money+=S.salary;

    S.fitness=clamp(S.fitness+rnd(8,16),0,100);

    S.form=clamp(
        S.form+rnd(-2,2),
        1,
        99
    );

    S.teamMorale=clamp(
        S.teamMorale+rnd(-3,3),
        1,
        100
    );

    S.careerMonths++;

    S.pendingEvent=event;
    S.eventResolved=false;

    saveGame();

    openMonthlyEvent();
}

/* ---------------------------------------------------------
   EVENT ROUTER
   --------------------------------------------------------- */

function openMonthlyEvent(){

    if(!S.pendingEvent)return;

    if(S.pendingEvent.type==="match"){

        openMatchMoment(
            S.pendingEvent.fixture
        );

        return;
    }

    if(S.pendingEvent.type==="dilemma"){

        openDilemma();

        return;
    }

    if(S.pendingEvent.type==="coach"){

        openCoachConversation();

        return;
    }
}

/* ---------------------------------------------------------
   EVENT FINISH
   --------------------------------------------------------- */

function reduceCooldowns(){
    if(S.personalCD>0) S.personalCD--;
    if(S.teamCD>0) S.teamCD--;
}

function finishMonthlyEvent(){
    if(!S.pendingEvent){
        S.eventResolved=true;
        render();
        return;
    }

    const eventType=S.pendingEvent.type;

    S.eventHistory.push({
        season:S.season,
        month:S.month,
        type:eventType
    });

    // Clear the lock FIRST. This prevents the "finish event first" dead-end.
    S.pendingEvent=null;
    S.eventResolved=true;
    S.currentDilemma=null;
    S.currentCoachTalk=null;
    S.currentMoment=null;

    reduceCooldowns();

    S.month++;

    saveGame();

    if(S.month>12){
        setTimeout(()=>endSeason(),50);
        return;
    }

    closeModal();
    render();
}

/* ---------------------------------------------------------
   MATCH MOMENTS
   --------------------------------------------------------- */

/*
  Every option is a real football action.
  No intentionally ridiculous answer.
  Difficulty is controlled by correct option,
  pressure, OVR and randomness.
*/

const MATCH_MOMENTS=[

{

function playerSvg(x,y,label,color="#39e27b",r=13){

    return `
        <g>
            <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="white" stroke-width="2"/>
            <text x="${x}" y="${y+4}" text-anchor="middle"
                fill="#07100d" font-size="9" font-weight="900">${esc(label||"")}</text>
        </g>
    `;
}

function ballSvg(x,y){

    return `
        <circle cx="${x}" cy="${y}" r="7" fill="white" stroke="#111" stroke-width="2"/>
        <path d="M${x-4} ${y-2} L${x} ${y-5} L${x+4} ${y-2} L${x+2} ${y+4} L${x-3} ${y+4} Z"
            fill="#111"/>
    `;
}

function arrowSvg(x1,y1,x2,y2,color="#fff"){

    const ang=Math.atan2(y2-y1,x2-x1);

    const a1=ang+.55;
    const a2=ang-.55;

    const len=11;

    return `
        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
            stroke="${color}" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="8 6"/>
        <polygon points="
            ${x2},${y2}
            ${x2-len*Math.cos(a1)},${y2-len*Math.sin(a1)}
            ${x2-len*Math.cos(a2)},${y2-len*Math.sin(a2)}
        " fill="${color}"/>
    `;
}

function findMoment(){

}

function openMatchMoment(fixture){

    const moment=findMoment();

    S.currentMoment={
        moment,
        fixture
    };

    const options=moment.choices.map((choice,i)=>{

        return `
            <button class="choice" onclick="chooseMatchMoment(${i})">
                ${i+1}. ${esc(choice)}
            </button>
        `;
    }).join("");

    showModal(
        `דקה 89 • ${esc(fixture.opponent)}`,
        `
        <div class="event-label">משחק חשוב • רגע מכריע</div>

        <h2 style="margin:8px 0 5px">${esc(moment.title)}</h2>

        <p class="muted" style="line-height:1.65">
            ${esc(moment.text)}
        </p>

        <div class="scene">
            ${sceneSvg(moment.scene)}
        </div>

        <div class="info">
            אתה לא מקבל תשובה אחת "מגוחכת" מול שלוש תשובות קלות.
            כל האפשרויות כאן הן פעולות כדורגל אמיתיות.
            צריך לקרוא את הסיטואציה.
        </div>

        <div class="choice-grid" style="margin-top:12px">
            ${options}
        </div>
        `
    );
}

function chooseMatchMoment(index){

    const data=S.currentMoment;

    if(!data)return;

    const moment=data.moment;
    const fixture=data.fixture;

    const correct=index===moment.correct;

    /*
      Even the correct decision can fail.
      High OVR helps, but nothing is guaranteed.
    */

    let probability=
        moment.successBase+
        (S.ovr-60)*.006+
        (S.form-50)*.003+
        (S.fitness-70)*.001;

    if(S.roleLevel===1){
        probability+=.04;
    }

    if(S.roleLevel===4){
        probability-=.04;
    }

    probability=clamp(probability,.18,.88);

    const successful=correct && Math.random()<probability;

    /*
      Complete the important match.
    */

    let userGoals;
    let oppGoals;

    const opp=fixture.opponentClub;

    if(successful){

        userGoals=Math.random()<.45?2:1;
        oppGoals=Math.random()<.30?0:1;

        S.goals++;
        S.seasonGoals++;

        if(Math.random()<.42){
            S.assists++;
            S.seasonAssists++;
        }

        S.apps++;
        S.seasonApps++;
        S.minutes+=Math.round(rnd(25,40));
        S.seasonMinutes+=Math.round(rnd(25,40));

        S.form=clamp(S.form+4,1,99);
        S.morale=clamp(S.morale+5,1,100);
        S.fanRep=clamp(S.fanRep+3,0,100);

    }else{

        userGoals=Math.random()<.30?1:0;
        oppGoals=Math.random()<.48?1:2;

        S.apps++;
        S.seasonApps++;
        S.minutes+=Math.round(rnd(18,35));
        S.seasonMinutes+=Math.round(rnd(18,35));

        S.form=clamp(
            S.form+(correct?-1:-4),
            1,
            99
        );

        S.morale=clamp(
            S.morale+(correct?0:-4),
            1,
            100
        );
    }

    if(!correct){

        S.trust=clamp(S.trust-3,1,100);
    }

    fixture.played=true;

    fixture.gf=fixture.home?userGoals:oppGoals;
    fixture.ga=fixture.home?oppGoals:userGoals;

    applyTeamResult(fixture);

    const resultText=
        userGoals>oppGoals?"ניצחון":
        userGoals<oppGoals?"הפסד":"תיקו";

    let title;
    let cls;
    let explanation;

    if(successful){

        title="מהלך מושלם";
        cls="good";

        explanation=
            `${moment.successText}
             <br><br>
             <strong>תוצאה במשחק: ${userGoals}:${oppGoals}</strong>
             <br>
             ${resultText}. קיבלת דחיפה באמון וביכולת.`;

    }else if(correct){

        title="החלטה נכונה, ביצוע לא מושלם";
        cls="neutral";

        explanation=
            `קראת את המצב נכון ובחרת בפעולה הנכונה,
             אבל ברמת הכדורגל המקצועני גם החלטה טובה יכולה להיכשל.
             <br><br>
             <strong>תוצאה במשחק: ${userGoals}:${oppGoals}</strong>
             <br>
             ${resultText}.`;

    }else{

        title="ההחלטה לא עבדה";
        cls="bad";

        explanation=
            `הבחירה שלך הייתה ${esc(moment.choices[index])}.
             במצב הזה ${esc(moment.choices[moment.correct])}
             הייתה האפשרות הטקטית המתאימה יותר.
             <br><br>
             ${moment.failText}
             <br><br>

function takePenalty(direction,height){

    if(window.penaltyBusy)return;
    window.penaltyBusy=true;

    const ball=$("penaltyBall");
    const keeper=$("keeper");
    const stage=$("penaltyStage");

    if(!ball||!keeper||!stage)return;

    const xMap={
        left:"25%",
        center:"50%",
        right:"75%"
    };

    const yMap={
        low:"72px",
        mid:"28px",
        high:"-15px"
    };

    const keeperDirection=
        pick(["left","center","right"]);

    const keeperHeight=
        pick(["low","mid","high"]);

    const sameDirection=
        keeperDirection===direction;

    const sameHeight=
        keeperHeight===height;

    /*
      Keeper has a genuine save chance.
      Better OVR improves placement.
    */

    let goalChance=.72;

    goalChance+=(S.ovr-60)*.006;
    goalChance+=(S.form-50)*.002;
    goalChance-=sameDirection?.28:0;

    if(sameDirection && sameHeight){
        goalChance-=.27;
    }

    if(direction==="center"){
        goalChance-=.10;
    }

    if(height==="high"){
        goalChance-=.06;
    }

    goalChance=clamp(goalChance,.25,.92);

    const scored=Math.random()<goalChance;

    // Start from the penalty spot, then visibly travel into the selected part of the goal.
    ball.style.left="50%";
    ball.style.bottom="42px";
    ball.style.transform="scale(1)";
    void ball.offsetWidth;
    ball.style.left=xMap[direction];
    ball.style.bottom=yMap[height];
    ball.style.transform="scale(.78)";

    let keeperX="0";

    if(keeperDirection==="left"){
        keeperX="-75px";
    }

    if(keeperDirection==="right"){
        keeperX="75px";
    }

    let keeperY="0";

    if(keeperHeight==="low"){
        keeperY="65px";
    }

    if(keeperHeight==="high"){
        keeperY="-30px";
    }

    keeper.style.transform=
        `translateX(calc(-50% + ${keeperX})) translateY(${keeperY}) rotate(${keeperDirection==="left"?-55:keeperDirection==="right"?55:0}deg)`;

    stage.classList.add("shot");

    S.penaltyStats.taken++;

    setTimeout(()=>{

        if(scored){

            S.penaltyStats.scored++;

            S.goals++;
            S.seasonGoals++;

            S.form=clamp(S.form+3,1,99);
            S.morale=clamp(S.morale+5,1,100);

            showModal(
                "גול!",
                `
                <div class="feedback good">
                    <strong>בעיטה ${height==="low"?"נמוכה":height==="high"?"גבוהה":"בגובה בינוני"}
                    ל${direction==="left"?"שמאל":direction==="right"?"ימין":"מרכז"}.</strong>
                    <br><br>
                    השוער זינק ${keeperDirection==="left"?"שמאלה":keeperDirection==="right"?"ימינה":"למרכז"}
                    ${keeperHeight==="low"?"ונמוך":"גבוה"},
                    אבל הכדור היה מחוץ להישג ידו.
                    <br><br>
                    <strong>הפנדל נכנס.</strong>
                </div>

                <button class="btn" style="margin-top:14px"
                    onclick="closeModal()">
                    המשך
                </button>
                `
            );

        }else{

            S.penaltyStats.missed++;

            S.form=clamp(S.form-2,1,99);
            S.morale=clamp(S.morale-4,1,100);

            showModal(
                "השוער עצר!",
                `
                <div class="feedback bad">
                    השוער קרא את הכיוון וזינק בזמן.
                    <br><br>
                    בעיטה ל${direction==="left"?"שמאל":direction==="right"?"ימין":"מרכז"},
                    ${height==="low"?"נמוך":height==="high"?"גבוה":"באמצע"}.
                    <br><br>
                    <strong>הפנדל הוחמץ.</strong>
                </div>

                <button class="btn" style="margin-top:14px"
                    onclick="closeModal()">
                    המשך
                </button>
                `
            );
        }

        saveGame();
        window.penaltyBusy=false;

    },800);
}

function applyEventEffects(effects){
    if(!effects)return;
    for(const [key,val] of Object.entries(effects)){
        if(typeof S[key]==="number"){
            const max = key==="fitness" ? 100 : 99;
            const min = key==="mediaRep"||key==="fanRep" ? 0 : 1;
            S[key]=clamp(S[key]+val,min,max);
        }
    }
}

function genericDilemmaChoice(index){
    const d=S.currentDilemma;
    if(!d)return;
    applyEventEffects(index===0?d.ae:d.be);
    showModal(
        index===0?"החלטה התקבלה":"בחרת בדרך אחרת",
        `
        <div class="feedback ${index===0?"good":"neutral"}">

    );
    saveGame();
}

    /* נשמר לתאימות עם שמירות ישנות ועם הקוד הקיים. */
    return genericDilemmaChoice(choice==="stay"?1:0);

function spinDilemma(){

    const wheel=$("dilemmaWheel");
    const button=$("spinButton");

    if(!wheel||!button)return;

    button.disabled=true;

    /*
      70% caught / 30% safe.
    */

    const caught=Math.random()<.70;

    let target;

    if(caught){

        target=360*5+rnd(40,250);

    }else{

        target=360*5+rnd(255,350);
    }

    wheel.style.transform=`rotate(${target}deg)`;

    setTimeout(()=>{

        if(caught){

            S.trust=clamp(S.trust-10,1,100);
            S.morale=clamp(S.morale-6,1,100);
            S.form=clamp(S.form-3,1,99);

            /*
              Punishment affects future playing time.
            */

            S.roleLevel=clamp(
                S.roleLevel+1,
                1,
                4
            );

            updateStatusFromRole();

            showModal(
                "המאמן גילה",
                `
                <div class="feedback bad">
                    הגעת לאימון עייף מדי והמאמן כבר שמע על היציאה.

function leagueDifficultyFactor(tier){
    return ({1:1.00,2:.78,3:.58,4:.40}[tier]||.5);
}

function seasonPerformanceScore(){
    const leagueFactor=leagueDifficultyFactor(S.club.tier);
    // A goal in a stronger league carries more offer value.
    const goalsValue=S.seasonGoals*(leagueFactor*1.55);
    const appsValue=S.seasonApps*0.65;
    const minutesValue=S.seasonMinutes/110;
    const assistsValue=S.seasonAssists*.7;
    const ovrValue=S.ovr*.55;
    const formValue=S.form*.20;
    return goalsValue+appsValue+minutesValue+assistsValue+ovrValue+formValue;
}

function offerEligibility(club,score){
    const currentTier=S.club.tier;
    const tierJump=currentTier-club.tier; // positive = move up
    const target=35 + club.level*.72 + (tierJump>0?12*tierJump:0);
    const gap=score-target;
    let chance=0;
    if(tierJump>0) chance=clamp(.08+gap*.012,0,.82);
    else if(tierJump===0) chance=clamp(.35+gap*.015,0.25,.95);
    else chance=clamp(.55+gap*.01,0.35,.98);
    return chance;
}

function seasonRoleFor(club,score){
    const strengthGap=S.ovr-club.level;
    const performanceBoost=Math.max(0,score-70)*.08;
    let effective=S.ovr+performanceBoost;
    if(club.tier<S.club.tier) effective+=Math.min(8,S.seasonGoals*.45);
    if(club.tier>S.club.tier) effective-=Math.min(8,Math.max(0,club.level-S.ovr)*.15);
    if(effective>=club.level+4) return 1;
    if(effective>=club.level-3) return 2;
    if(effective>=club.level-11) return 3;
    return 4;
}

function makeSeasonOffers(){
    const score=seasonPerformanceScore();
    const current=S.club;
    const candidates=[];

    // Staying is always a real option, with status earned from the completed season.
    candidates.push({
        club:current,
        role:seasonRoleFor(current,score),
        salary:salaryFor(current,seasonRoleFor(current,score),S.ovr),
        stay:true,
        reason:"הישארות בקבוצה הנוכחית"
    });

    const tierOptions=[current.tier-1,current.tier,current.tier+1].filter(t=>t>=1&&t<=4);
    for(const tier of tierOptions){
        const pool=CLUBS.filter(c=>c.tier===tier && c.name!==current.name);
        for(const club of pool){
            const chance=offerEligibility(club,score);
            if(Math.random()<chance){
                const role=seasonRoleFor(club,score);
                candidates.push({
                    club,role,
                    salary:salaryFor(club,role,S.ovr),
                    stay:false,
                    reason:tier<current.tier?"קפיצה לליגה גבוהה יותר":tier===current.tier?"עניין מקבוצה באותה ליגה":"אפשרות בטוחה יותר"
                });
            }
        }
    }

    // Keep offers logical: no sudden leap across multiple tiers unless an exceptional season.
    const maxTierJump=(S.seasonGoals>=15 && S.seasonApps>=22 && S.ovr>=75)?2:1;
    let filtered=candidates.filter(o=>Math.abs(o.club.tier-current.tier)<=maxTierJump);

    // Prefer a gradual spread around the player's current level.
    filtered.sort((a,b)=>{
        const da=Math.abs(a.club.level-(S.ovr+S.seasonGoals*1.2));
        const db=Math.abs(b.club.level-(S.ovr+S.seasonGoals*1.2));
        return da-db;
    });

    const chosen=[];
    for(const o of filtered){
        if(!chosen.some(x=>x.club.name===o.club.name)) chosen.push(o);
        if(chosen.length>=5) break;
    }

    if(!chosen.some(o=>o.stay)){
        chosen.unshift(candidates[0]);
    }

    return chosen.slice(0,5);
}

function endSeason(){
    if(!S.club)return;

    syncTable();

    const rows=Object.values(S.table);
    rows.sort((a,b)=>{
        if(b.pts!==a.pts)return b.pts-a.pts;
        return (b.gf-b.ga)-(a.gf-a.ga);
    });

    const place=rows.findIndex(r=>r.club.name===S.club.name)+1;

    if(place===1){
        S.trophies.push(`${S.club.league} - עונה ${S.season}`);
    }

    const performance=seasonPerformanceScore();
    S.currentOffers=makeSeasonOffers();

    S.news.unshift(`עונה ${S.season} הסתיימה במקום ${place}. ${S.seasonGoals} שערים, ${S.seasonApps} הופעות.`);

    showModal(
        `סיום עונה ${S.season}`,
        `
        <div class="feedback ${place===1?"good":"neutral"}">
            ${place===1?"סיימת במקום הראשון וזכית באליפות.":"סיימת את העונה במקום "+place+"."}
            <br><br>
            הצעות הקבוצות מחושבות לפי הליגה שבה שיחקת, השערים, ההופעות, ה-OVR והמעמד שלך.
            <br>
            <strong>מדד העונה: ${Math.round(performance)}</strong>
        </div>

        <div class="grid grid-3" style="margin-top:12px">
            <div class="stat"><div class="label">הופעות</div><div class="value">${S.seasonApps}</div></div>
            <div class="stat"><div class="label">שערים</div><div class="value">${S.seasonGoals}</div></div>
            <div class="stat"><div class="label">בישולים</div><div class="value">${S.seasonAssists}</div></div>
        </div>

        <button class="btn" style="margin-top:14px" onclick="showSeasonOffers()">
            לראות את הצעות העונה
        </button>
        `
    );
    saveGame();
}

function showSeasonOffers(){
    closeModal();
    S.screen="offers";
    render();
}

function startNextSeason(offerIndex=null){
    // תאימות: אם נקרא מהקוד הישן, נפתח הצעות במקום לדלג עליהן.
    if(offerIndex===null){
        if(S.currentOffers && S.currentOffers.length){
            showSeasonOffers();
            return;
        }
        S.currentOffers=makeSeasonOffers();
        showSeasonOffers();
        return;
    }

    chooseSeasonOffer(offerIndex);
}

function chooseSeasonOffer(index){
    const offer=S.currentOffers[index];
    if(!offer)return;

    const previousApps=S.seasonApps;

    S.club=offer.club;
    S.roleLevel=offer.role;
    S.status=ROLE_NAMES[S.roleLevel];
    S.salary=offer.salary;

    S.season++;
    S.year++;
    S.age++;

    S.seasonApps=0;
    S.seasonGoals=0;
    S.seasonAssists=0;
    S.seasonMinutes=0;

    S.fixtures=[];
    S.table={};
    S.pendingEvent=null;
    S.eventResolved=true;
    S.currentDilemma=null;
    S.currentCoachTalk=null;
    S.currentMoment=null;

    // Slow, believable development.
    const development =
        previousApps>=18 ? rnd(1,3) :
        previousApps>=10 ? rnd(0,2) :
        rnd(0,1);

    S.ovr=clamp(S.ovr+development,45,99);

    buildCareer();
    S.screen="dashboard";
    saveGame();
    render();
}

function createPlayer(){

    const name=$("startName").value.trim();
    const age=Number($("startAge").value);
    const ovr=Number($("startOvr").value);

    if(name.length<2){

        toast("תכניס שם נורמלי לשחקן");

        return;
    }

    S.name=name;
    S.age=age;
    S.ovr=ovr;

    S.currentOffers=makeOffers();

    // New career always begins in the visible 2027 season/year.
    S.year=2027;
    S.season=1;

        return (b.gf-b.ga)-(a.gf-a.ga);

    return `

function agentPing(){

    const threshold=
        S.ovr+
        S.mediaRep*.15+
        S.seasonGoals*1.2+
        S.seasonAssists*.5;

    let msg;

    if(threshold>88){

        msg="יש עניין ראשוני ממספר מועדונים. עדיין אין הצעה רשמית.";

    }else if(threshold>72){

        msg="השוק מתחיל לשים לב אליך. הסוכן ממליץ להמשיך לצבור דקות.";

    }else{

        msg="כרגע אין משהו רציני. הסוכן אומר שהדבר החשוב ביותר הוא דקות משחק.";
    }

    showModal(
        "עדכון מהסוכן",
        `
        <div class="feedback neutral">
            ${esc(msg)}
        </div>

        <button class="btn" style="margin-top:14px"
            onclick="closeModal()">
            הבנתי
        </button>
        `
    );
}

            <div class="label">עונות</div>
            <div class="value">${S.season}</div>
        </div>

        <div class="stat">
            <div class="label">הופעות</div>
            <div class="value">${S.apps}</div>
        </div>

        <div class="stat">
            <div class="label">שערים</div>
            <div class="value">${S.goals}</div>
        </div>

        <div class="stat">
            <div class="label">בישולים</div>
            <div class="value">${S.assists}</div>
        </div>

    </div>

    <div class="card">

        <h3>תארים</h3>

        ${
            S.trophies.length
            ?
            S.trophies.map(t=>`
                <div class="list-row">
                    <span>${esc(t)}</span>
                    <strong>🏆</strong>
                </div>
            `).join("")
            :
            `<div class="muted">
                עדיין אין תארים. הדרך לשם אמורה להיות קשה.
            </div>`
        }

    </div>

    <div class="card">

        <h3>היסטוריית אירועים</h3>

        ${
            S.eventHistory.length
            ?
            S.eventHistory.slice(-12).reverse().map(e=>`

                <div class="list-row">

                    <span>
                        עונה ${e.season},
                        חודש ${e.month}
                    </span>

                    <span class="tag">
                        ${
                            e.type==="match"
                            ?"רגע משחק"
                            :
                            e.type==="dilemma"
                            ?"דילמה"
                            :
                            "מאמן"
                        }
                    </span>

                </div>

            `).join("")
            :
            `<div class="muted">
                עדיין לא היו אירועים.
            </div>`
        }

    </div>

    `;
}

/* ---------------------------------------------------------
   PROFILE
   --------------------------------------------------------- */

function profile(){

    return `

    <div class="hero">

        <div class="event-label">PLAYER PROFILE</div>

        <h1>${esc(S.name)}</h1>

        <p>
            גיל ${S.age}
            • ${esc(POS[S.pos])}
            • ${esc(S.club?.name||"ללא קבוצה")}
        </p>

    </div>

    <div class="grid grid-3">

        <div class="stat">
            <div class="label">OVR</div>
            <div class="big-number">${S.ovr}</div>
        </div>

        <div class="stat">
            <div class="label">מעמד</div>
            <div class="value">${esc(S.status)}</div>
        </div>

        <div class="stat">
            <div class="label">שכר</div>
            <div class="value">₪${S.salary.toLocaleString()}</div>
        </div>

    </div>

    <div class="card">

        <div class="list-row">
            <span>מורל</span>
            <strong>${S.morale}</strong>
        </div>

        <div class="list-row">
            <span>כושר</span>
            <strong>${S.fitness}</strong>
        </div>

        <div class="list-row">
            <span>כושר משחק</span>
            <strong>${S.form}</strong>
        </div>

        <div class="list-row">
            <span>אמון המאמן</span>
            <strong>${S.trust}</strong>
        </div>

        <div class="list-row">
            <span>מוניטין אוהדים</span>
            <strong>${S.fanRep}</strong>
        </div>

    </div>

    <div class="card">

        <h3>פנדלים</h3>

        <div class="grid grid-3">

            <div class="stat">
                <div class="label">נלקחו</div>
                <div class="value">${S.penaltyStats.taken}</div>
            </div>

            <div class="stat">
                <div class="label">נכבשו</div>
                <div class="value">${S.penaltyStats.scored}</div>
            </div>

            <div class="stat">
                <div class="label">הוחמצו</div>
                <div class="value">${S.penaltyStats.missed}</div>
            </div>

        </div>

        <button class="btn secondary"
            style="margin-top:12px"
            onclick="openPenalty()">
            תרגל פנדל
        </button>

    </div>

    `;
}

/* ---------------------------------------------------------
   NAVIGATION
   --------------------------------------------------------- */

function navTo(screen){

    if(!S.club)return;

    S.screen=screen;

    render();
}

function updateNav(){

    const nav=$("bottomNav");

    if(!S.club || S.screen==="start" || S.screen==="offers"){

        nav.classList.add("hidden");

        return;
    }

    nav.classList.remove("hidden");

    document.querySelectorAll(".nav-item")
        .forEach(btn=>{

            btn.classList.toggle(
                "active",
                btn.dataset.screen===S.screen
            );
        });
}

/* ---------------------------------------------------------
   MAIN RENDER
   --------------------------------------------------------- */

function render(){

    ensureState();

    const page=$("page");

    if(S.screen==="start"){

        page.innerHTML=renderStart();

    }else if(S.screen==="offers"){

        page.innerHTML=renderOffers();

    }else if(S.screen==="dashboard"){

        page.innerHTML=dashboard();

    }else if(S.screen==="matches"){

        page.innerHTML=matches();

    }else if(S.screen==="season"){

        page.innerHTML=season();

    }else if(S.screen==="training"){

        page.innerHTML=training();

    }else if(S.screen==="agent"){

        page.innerHTML=agent();

    }else if(S.screen==="locker"){

        page.innerHTML=locker();

    }else if(S.screen==="career"){

        page.innerHTML=career();

    }else if(S.screen==="profile"){

        page.innerHTML=profile();

    }else{

        S.screen="dashboard";

        page.innerHTML=dashboard();
    }

    updateNav();
}

/* ---------------------------------------------------------
   MODAL
   --------------------------------------------------------- */

function showModal(title,html){

    $("modalTitle").innerHTML=title;
    $("modalBody").innerHTML=html;

    $("modalBackdrop").classList.add("show");
}

function closeModal(){

    $("modalBackdrop").classList.remove("show");
}



/* ---------------------------------------------------------
   START
   --------------------------------------------------------- */

ensureState();
render();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
